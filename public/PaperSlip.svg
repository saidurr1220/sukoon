        fill="#FFF9E6" 
        stroke="#D4C5A0" 
        stroke-width="1.5"/>
  
  <!-- Paper texture lines -->
  <line x1="40" y1="40" x2="140" y2="40" stroke="#E8DCC0" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="60" x2="140" y2="60" stroke="#E8DCC0" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="80" x2="140" y2="80" stroke="#E8DCC0" stroke-width="1" opacity="0.5"/>
  
  <!-- Folded corner effect -->
